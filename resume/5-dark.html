<!doctype html>
<html lang="en">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7JRHDZQFYB"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-7JRHDZQFYB");</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinoth S Resume, Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  :root { --bg:#0E1014; --card:#161920; --card2:#1D2129; --line:#2A2F3A; --ink:#EEF0F4; --ink2:#B7BDC9; --mute:#838A99; --amber:#F5B942; --cyan:#4CC9F0; }
  * { box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html,body { margin:0; }
  body { background:#050608; color:var(--ink); font:8.9pt/1.5 'Inter', Arial, sans-serif; }
  [data-lucide] { width:1em; height:1em; }
  .page { width:210mm; height:297mm; margin:12px auto; gap:2.6mm; background:radial-gradient(60mm 60mm at 100% 0%,rgba(245,185,66,.16),transparent),radial-gradient(70mm 70mm at 0% 100%,rgba(76,201,240,.1),transparent),var(--bg); padding:10.5mm 14mm 9mm; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; position:relative; }
  .page > * { position:relative; }
  h1,h2,h3,h4 { font-family:'Space Grotesk', sans-serif; margin:0; }
  header.top { display:grid; grid-template-columns:auto 1fr; gap:6mm; align-items:center; }
  .photo { width:27mm; height:27mm; border-radius:6mm; object-fit:cover; border:1px solid var(--line); }
  h1 { font-size:28pt; font-weight:700; letter-spacing:.06em; line-height:1; }
  .title { font:600 11pt 'Space Grotesk'; color:var(--amber); margin-top:1.6mm; }
  .r-contact { list-style:none; margin:3.2mm 0 0; padding:0; display:flex; flex-wrap:wrap; gap:1.6mm; font-size:8.2pt; }
  .r-contact li { display:flex; align-items:center; gap:1.6mm; padding:.8mm 2.4mm; border:1px solid var(--line); border-radius:10mm; background:var(--card); }
  .r-contact [data-lucide] { color:var(--cyan); }
  .r-contact a { color:var(--ink2); text-decoration:none; }
  h2 { font-size:10.5pt; font-weight:700; color:var(--ink); margin-bottom:2.6mm; display:flex; align-items:center; gap:2.5mm; letter-spacing:.1em; text-transform:uppercase; }
  h2::before { content:""; width:1.4mm; height:4mm; border-radius:1mm; background:linear-gradient(var(--amber),var(--cyan)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:3mm; padding:3mm 4mm; }
  .r-metrics { display:grid; grid-template-columns:repeat(6,1fr); gap:2.4mm; }
  .r-metrics div { background:var(--card); border:1px solid var(--line); border-radius:2.5mm; padding:2.8mm 2.6mm; }
  .r-metrics b { display:block; font:700 16pt 'Space Grotesk'; color:var(--amber); line-height:1.05; }
  .r-metrics div:nth-child(even) b { color:var(--cyan); }
  .r-metrics span { font-size:7.4pt; color:var(--mute); line-height:1.25; display:block; margin-top:.6mm; }
  .duo { display:grid; grid-template-columns:1.25fr 1fr; gap:4mm; }
  .r-summary { margin:0; color:var(--ink2); }
  .r-ai h4 { font-size:10pt; display:flex; gap:2mm; align-items:center; color:var(--amber); margin-bottom:1.4mm; }
  .r-ai p { margin:0; color:var(--ink2); }
  .r-job header { display:flex; justify-content:space-between; gap:4mm; align-items:baseline; }
  .r-job h3 { font-size:10.8pt; font-weight:700; }
  .r-org { margin:.4mm 0 0; color:var(--mute); }
  .r-dates { font-size:8pt; font-weight:600; color:var(--bg); background:var(--amber); padding:.5mm 2.2mm; border-radius:10mm; white-space:nowrap; }
  .r-intro { margin:2mm 0 0; color:var(--ink2); }
  .r-group { margin:3mm 0 1mm; font-size:9pt; font-weight:600; color:var(--cyan); }
  .r-job ul { margin:0; padding-left:4.2mm; }
  .r-job li { margin-bottom:1.2mm; color:var(--ink2); }
  .r-job li::marker { color:var(--amber); }
  .r-job + .r-job { margin-top:3.5mm; padding-top:3mm; border-top:1px solid var(--line); }
  .r-projects { display:grid; grid-template-columns:repeat(3,1fr); gap:2.4mm; }
  .r-proj { background:var(--card); border:1px solid var(--line); border-radius:2.5mm; padding:2.8mm 3.2mm; }
  .r-proj b { font-family:'Space Grotesk'; font-size:9.4pt; display:block; }
  .r-stack { display:block; font-size:7.4pt; color:var(--cyan); margin:.4mm 0 .6mm; }
  .r-proj p { margin:0; font-size:8.2pt; color:var(--ink2); line-height:1.45; }
  .r-skills { display:grid; grid-template-columns:repeat(3,1fr); gap:2.2mm 5mm; }
  .r-skill h4 { font-size:9pt; color:var(--amber); margin-bottom:1.2mm; }
  .r-tags { display:flex; flex-wrap:wrap; gap:1.1mm; }
  .r-tags span { font-size:7.6pt; padding:.4mm 1.8mm; border-radius:10mm; background:var(--card2); border:1px solid var(--line); color:var(--ink2); }
  .row3 { display:grid; grid-template-columns:1.2fr 1fr; gap:3mm; }
  .r-edu b { display:block; font-family:'Space Grotesk'; }
  .r-edu span { display:block; color:var(--ink2); font-size:8.6pt; }
  .r-langs { list-style:none; margin:0; padding:0; }
  .r-langs li { display:flex; justify-content:space-between; padding:.8mm 0; border-bottom:1px solid var(--line); }
  .r-langs span { color:var(--mute); }
  .r-strengths { display:grid; grid-template-columns:repeat(4,1fr); gap:4mm; }
  .r-strengths b { font-family:'Space Grotesk'; color:var(--amber); font-size:9.2pt; }
  .r-strengths p { margin:.3mm 0 0; color:var(--ink2); font-size:8pt; line-height:1.35; }
  .r-free { margin:0; color:var(--bg); }
  .free { background:linear-gradient(120deg,var(--amber),#F7D07A); border:0; }
  .free h2 { color:var(--bg); } .free h2::before { background:var(--bg); }
  .r-strengths { display:grid; grid-template-columns:repeat(4,1fr); gap:4mm; }
  .r-strengths b { font-family:'Space Grotesk'; color:var(--amber); font-size:9.2pt; }
  .r-strengths p { margin:.3mm 0 0; color:var(--ink2); font-size:8pt; line-height:1.35; }
  .r-free { font-weight:600; }
  @media print { body { background:none; } .page { margin:0; break-after:page; } }
  @media screen and (max-width:820px) { .page { width:auto; height:auto; margin:0 0 12px; padding:22px 16px; gap:16px; } .duo, .row3, .r-projects, .r-skills, header.top { grid-template-columns:1fr; } .r-metrics { grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>
<section class="page" id="p1"></section>
<section class="page" id="p2"></section>
<script src="data/content.js"></script>
<script src="data/render.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
  const h = window.H, R = window.R;
  document.getElementById("p1").innerHTML = `
    <header class="top"><img class="photo" src="../portfolio/assets/img/avatar.jpg" alt="Vinoth S"><div><h1>${h.esc(R.name)}</h1><div class="title">${h.esc(R.title)}</div>${h.contact()}</div></header>
    ${h.metrics()}
    <div class="duo"><section class="card"><h2>Profile</h2>${h.summary()}</section><section class="card">${h.ai()}</section></div>
    <section class="card"><h2>Experience</h2>${h.jobPart(0, 0, 2)}</section>`;
  document.getElementById("p2").innerHTML = `
    <section class="card">${h.jobPart(0, 2, 4, true)}${h.job(R.experience[1])}</section>
    <section class="card"><h2>Skills</h2>${h.skills()}</section>
    <section class="card"><h2>Strengths</h2>${h.strengths()}</section>
    <div class="row3">
      <section class="card"><h2>Education</h2>${h.education()}</section>
      <section class="card"><h2>Languages</h2>${h.languages()}</section>
    </div>`;
  h.done();
</script>
</body>
</html>
