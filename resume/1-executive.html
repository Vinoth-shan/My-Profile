<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinoth S Resume, Executive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  :root { --ink:#22262E; --ink2:#454B57; --mute:#737986; --line:#E4DFD8; --accent:#7A1F2B; --accent2:#B0525E; --paper:#FFFFFF; --tint:#FAF6F2; }
  * { box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html,body { margin:0; }
  body { background:#D9D6D2; color:var(--ink); font:10pt/1.5 'Source Sans 3', Arial, sans-serif; }
  [data-lucide] { width:1em; height:1em; }
  .page { width:210mm; height:297mm; margin:12px auto; background:var(--paper); padding:13mm 17mm 9mm; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; position:relative; box-shadow:0 8px 30px rgba(0,0,0,.12); }
  .page::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4mm; background:var(--accent); }
  h1,h2,h3 { font-family:'Fraunces', Georgia, serif; margin:0; font-weight:600; }
  header.top { display:grid; grid-template-columns:1fr auto; gap:10mm; align-items:end; padding-bottom:5mm; border-bottom:1.5px solid var(--ink); }
  h1 { font-size:30pt; letter-spacing:.06em; line-height:1; font-weight:700; }
  .title { font:600 12pt 'Source Sans 3'; color:var(--accent); margin-top:2.5mm; letter-spacing:.02em; }
  .r-contact { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:auto auto; gap:1.4mm 7mm; font-size:9pt; }
  .r-contact li { display:flex; align-items:center; gap:2mm; }
  .r-contact [data-lucide] { color:var(--accent); }
  .r-contact a { color:var(--ink); text-decoration:none; }
  h2 { font-size:12.5pt; color:var(--accent); display:flex; align-items:center; gap:3mm; margin-bottom:2.4mm; }
  h2::after { content:""; flex:1; height:1px; background:var(--line); }
  .r-summary { margin:0; color:var(--ink2); font-size:10.2pt; line-height:1.6; }
  .r-metrics { display:grid; grid-template-columns:repeat(6,1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .r-metrics div { padding:3mm 2mm; text-align:center; border-right:1px solid var(--line); }
  .r-metrics div:last-child { border-right:0; }
  .r-metrics b { display:block; font:700 17pt 'Fraunces', serif; color:var(--accent); line-height:1.1; }
  .r-metrics span { font-size:8pt; color:var(--mute); line-height:1.25; display:block; margin-top:1mm; }
  .r-ai { background:var(--tint); border-left:3px solid var(--accent); padding:3.5mm 5mm; }
  .r-ai h4 { margin:0 0 1.2mm; font:600 10.5pt 'Fraunces', serif; color:var(--accent); display:flex; align-items:center; gap:2mm; }
  .r-ai p { margin:0; color:var(--ink2); }
  .r-job header { display:flex; justify-content:space-between; align-items:baseline; gap:6mm; }
  .r-job h3 { font-size:12pt; }
  .r-org { margin:.6mm 0 0; color:var(--mute); font-size:9.5pt; }
  .r-dates { font-size:9pt; font-weight:600; color:var(--accent); white-space:nowrap; }
  .r-intro { margin:2.2mm 0 1mm; color:var(--ink2); font-style:italic; }
  .r-group { margin:3mm 0 1.2mm; font-size:9.2pt; font-weight:700; letter-spacing:.08em; color:var(--ink); text-transform:uppercase; }
  .r-job ul { margin:0; padding-left:4.5mm; }
  .r-job li { margin-bottom:1.05mm; color:var(--ink2); }
  .r-job li::marker { color:var(--accent); }
  .r-job + .r-job { margin-top:3.5mm; }
  .r-projects { display:grid; grid-template-columns:1fr 1fr; gap:2.4mm 7mm; }
  .r-proj b { font:600 10.5pt 'Fraunces', serif; display:block; }
  .r-stack { display:block; font-size:8.3pt; color:var(--accent2); font-weight:600; margin:.4mm 0 .6mm; }
  .r-proj p { margin:0; font-size:9.3pt; color:var(--ink2); }
  .cols { display:grid; grid-template-columns:1.25fr 1fr; gap:9mm; }
  .r-skills { display:grid; grid-template-columns:repeat(3,1fr); gap:2.2mm 7mm; }
  .r-skill { margin:0; }
  .row3 { display:grid; grid-template-columns:1.3fr 1fr; gap:10mm; }
  .r-skill h4 { margin:0 0 1mm; font-size:9.3pt; font-weight:700; }
  .r-tags { color:var(--ink2); font-size:9.2pt; }
  .r-tags span:not(:last-child)::after { content:" · "; color:var(--accent2); }
  .r-edu b { display:block; font:600 10.5pt 'Fraunces', serif; }
  .r-edu span { display:block; color:var(--ink2); font-size:9.3pt; }
  .r-langs { list-style:none; padding:0; margin:0; }
  .r-langs li { display:flex; justify-content:space-between; border-bottom:1px dotted var(--line); padding:1mm 0; font-size:9.5pt; }
  .r-langs span { color:var(--mute); }
  .r-strengths div { margin-bottom:2.2mm; }
  .r-strengths b { font-size:9.6pt; }
  .r-strengths p { margin:.3mm 0 0; color:var(--ink2); font-size:9.2pt; }
  .r-free { margin:0; padding:2.5mm 3.5mm; background:var(--tint); color:var(--accent); font-weight:600; font-size:9.4pt; }
  .stack-gap > * + * { margin-top:5mm; }
  .pn { position:absolute; right:17mm; top:6mm; font-size:8pt; color:var(--mute); }
  @media print { body { background:none; } .page { margin:0; box-shadow:none; break-after:page; } }
  @media screen and (max-width:820px) { .page { width:auto; height:auto; margin:0 0 12px; padding:22px 18px 22px 26px; gap:18px; } header.top, .cols, .r-projects, .r-skills, .row3 { grid-template-columns:1fr; } .r-metrics { grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>
<section class="page" id="p1"></section>
<section class="page" id="p2"></section>
<script src="data/content.js"></script>
<script src="data/render.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
  const h = window.H, R = window.R;
  document.getElementById("p1").innerHTML = `
    <header class="top"><div><h1>${h.esc(R.name)}</h1><div class="title">${h.esc(R.title)}</div></div>${h.contact()}</header>
    <section><h2>Profile</h2>${h.summary()}</section>
    ${h.metrics()}
    ${h.ai()}
    <section><h2>Experience</h2>${h.jobPart(0, 0, 2)}</section>
    <span class="pn">1 / 2</span>`;
  document.getElementById("p2").innerHTML = `
    <section>${h.jobPart(0, 2, 4, true)}${h.job(R.experience[1])}</section>
    <section><h2>Selected projects</h2>${h.projects(6)}</section>
    <section><h2>Skills</h2>${h.skills()}</section>
    <div class="row3">
      <section><h2>Education</h2>${h.education()}</section>
      <section><h2>Languages</h2>${h.languages()}</section>
    </div>
    <span class="pn">2 / 2</span>`;
  h.done();
</script>
</body>
</html>
