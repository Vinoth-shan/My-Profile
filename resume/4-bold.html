<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinoth S Resume, Bold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  :root { --graphite:#23262B; --graphite2:#2E3238; --coral:#E4572E; --coral2:#F28C6A; --ink:#1F2226; --ink2:#4A4F57; --mute:#80858E; --line:#E6E7EA; --soft:#F5F4F2; }
  * { box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  html,body { margin:0; }
  body { background:#D7D8DB; color:var(--ink); font:9.1pt/1.5 'Karla', Arial, sans-serif; }
  [data-lucide] { width:1em; height:1em; }
  .page { width:210mm; height:297mm; margin:12px auto; background:#fff; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.12); }
  h1,h2,h3,h4 { font-family:'Outfit', sans-serif; margin:0; }
  .band { background:var(--graphite); color:#fff; padding:9mm 15mm 7mm; position:relative; }
  .band::after { content:""; position:absolute; left:15mm; bottom:0; width:40mm; height:1.6mm; background:var(--coral); }
  .band h1 { font-size:32pt; font-weight:800; letter-spacing:.05em; line-height:1; }
  .band .title { font:600 12pt 'Outfit'; color:var(--coral2); margin-top:2mm; }
  .band .tag { color:#C4C7CD; margin-top:2mm; max-width:150mm; }
  .band .r-contact { list-style:none; margin:5mm 0 0; padding:0; display:flex; flex-wrap:wrap; gap:1.6mm 6mm; font-size:8.8pt; }
  .band .r-contact li { display:flex; gap:1.8mm; align-items:center; }
  .band .r-contact [data-lucide] { color:var(--coral); }
  .band .r-contact a { color:#E7E9EC; text-decoration:none; }
  .band.slim { padding:7mm 15mm 6mm; display:flex; justify-content:space-between; align-items:center; }
  .band.slim h1 { font-size:15pt; }
  .band.slim span { color:#C4C7CD; font-size:9pt; }
  .strip { background:var(--soft); }
  .strip .r-metrics { display:grid; grid-template-columns:repeat(6,1fr); padding:0 15mm; }
  .strip .r-metrics div { padding:2.8mm 1mm; border-right:1px solid var(--line); text-align:center; }
  .strip .r-metrics div:last-child { border-right:0; }
  .strip .r-metrics b { display:block; font:800 16pt 'Outfit'; color:var(--coral); line-height:1.1; }
  .strip .r-metrics span { font-size:7.8pt; color:var(--mute); line-height:1.25; display:block; }
  .body { flex:1; display:grid; grid-template-columns:1fr 58mm; gap:7mm; padding:5.5mm 15mm 8mm; }
  .col { display:flex; flex-direction:column; justify-content:space-between; gap:5mm; min-width:0; }
  h2 { font-size:12pt; font-weight:700; color:var(--graphite); margin-bottom:2.6mm; display:flex; align-items:center; gap:2.5mm; text-transform:uppercase; letter-spacing:.08em; }
  h2::before { content:""; width:2.6mm; height:2.6mm; background:var(--coral); transform:rotate(45deg); }
  .r-summary { margin:0; color:var(--ink2); }
  .r-job header { display:flex; justify-content:space-between; align-items:baseline; gap:4mm; }
  .r-job h3 { font-size:11pt; font-weight:700; }
  .r-org { margin:.4mm 0 0; color:var(--mute); font-size:9pt; }
  .r-dates { font-size:8.4pt; font-weight:700; color:#fff; background:var(--graphite); padding:.6mm 2.2mm; border-radius:1mm; white-space:nowrap; }
  .r-intro { margin:2mm 0 0; color:var(--ink2); }
  .r-group { margin:3mm 0 1mm; font-size:9.2pt; font-weight:700; color:var(--coral); }
  .r-job ul { margin:0; padding-left:4.2mm; }
  .r-job li { margin-bottom:.9mm; color:var(--ink2); }
  .r-job li::marker { color:var(--coral); content:"▸  "; }
  .r-job + .r-job { margin-top:4.5mm; }
  .side-card { background:var(--soft); border-radius:2.5mm; padding:3.3mm; }
  .r-ai h4 { font-size:10pt; display:flex; gap:2mm; align-items:center; margin-bottom:1.2mm; color:var(--graphite); }
  .r-ai h4 [data-lucide] { color:var(--coral); }
  .r-ai p { margin:0; color:var(--ink2); font-size:9pt; }
  .r-skill { margin-bottom:2.3mm; }
  .r-skill h4 { font-size:9.4pt; margin-bottom:1.2mm; }
  .r-tags { display:flex; flex-wrap:wrap; gap:1.2mm; }
  .r-tags span { font-size:8pt; padding:.5mm 1.8mm; border:1px solid #F3C3B3; color:#A73A18; border-radius:1mm; background:#FFF6F2; }
  .r-projects { display:grid; grid-template-columns:1fr 1fr; gap:2.6mm 5mm; }
  .r-proj { border-left:2px solid var(--coral); padding-left:3mm; }
  .r-proj b { font-family:'Outfit'; font-size:9.8pt; display:block; }
  .r-stack { display:block; font-size:7.8pt; color:var(--mute); font-weight:600; }
  .r-proj p { margin:.4mm 0 0; font-size:8.8pt; color:var(--ink2); }
  .r-edu b { display:block; font-family:'Outfit'; }
  .r-edu span { display:block; color:var(--ink2); font-size:9pt; }
  .r-langs { list-style:none; margin:0; padding:0; }
  .r-langs li { display:flex; justify-content:space-between; font-size:9pt; padding:.8mm 0; border-bottom:1px dashed var(--line); }
  .r-langs span { color:var(--mute); }
  .r-strengths div { margin-bottom:2.4mm; } .r-strengths b { font-family:'Outfit'; font-size:9.6pt; } .r-strengths p { margin:.2mm 0 0; font-size:8.8pt; color:var(--ink2); }
  .links .r-contact { list-style:none; margin:0; padding:0; display:grid; gap:1.6mm; font-size:9pt; }
  .links .r-contact li { display:flex; gap:2mm; align-items:center; }
  .links .r-contact [data-lucide] { color:var(--coral); }
  .links .r-contact a { color:var(--ink2); text-decoration:none; }
  .r-free { margin:0; background:var(--coral); color:#fff; border-radius:2.5mm; padding:3.5mm 4mm; font-weight:600; font-size:9pt; }
  @media print { body { background:none; } .page { margin:0; box-shadow:none; break-after:page; } }
  @media screen and (max-width:820px) { .page { width:auto; height:auto; margin:0 0 12px; } .body { grid-template-columns:1fr; padding:18px; } .band { padding:22px 18px 16px; } .strip .r-metrics { grid-template-columns:repeat(3,1fr); padding:0 18px; } .r-projects { grid-template-columns:1fr; } }
</style>
</head>
<body>
<section class="page" id="p1"></section>
<section class="page" id="p2"></section>
<script src="data/content.js"></script>
<script src="data/render.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
  const h = window.H, R = window.R;
  const skillsPart = (a, b) => `<div class="r-skills">${R.skills.slice(a, b).map(([g, items]) => `<div class="r-skill"><h4>${h.esc(g)}</h4><div class="r-tags">${items.map(t => `<span>${h.esc(t)}</span>`).join("")}</div></div>`).join("")}</div>`;
  document.getElementById("p1").innerHTML = `
    <div class="band"><h1>${h.esc(R.name)}</h1><div class="title">${h.esc(R.title)}</div>${h.contact()}</div>
    <div class="strip">${h.metrics()}</div>
    <div class="body">
      <div class="col"><section><h2>Profile</h2>${h.summary()}</section><section><h2>Experience</h2>${h.jobPart(0, 0, 2)}</section></div>
      <div class="col"><div class="side-card">${h.ai()}</div><section><h2>Skills</h2>${skillsPart(0, 3)}</section><section><h2>Education</h2>${h.education()}</section></div>
    </div>`;
  document.getElementById("p2").innerHTML = `
    <div class="band slim"><h1>${h.esc(R.name)}</h1><span>${h.esc(R.title)} · page 2</span></div>
    <div class="body">
      <div class="col"><section>${h.jobPart(0, 2, 4, true)}${h.job(R.experience[1])}</section><section><h2>Selected projects</h2>${h.projects(6)}</section></div>
      <div class="col"><section><h2>More skills</h2>${skillsPart(3, 6)}</section><section><h2>Languages</h2>${h.languages()}</section><section><h2>Strengths</h2>${h.strengths()}</section><section class="links"><h2>Links</h2>${h.contact(["globe","github"])}</section></div>
    </div>`;
  h.done();
</script>
</body>
</html>
